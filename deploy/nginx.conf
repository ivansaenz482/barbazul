# ============================================================
#  Configuracion de Nginx (proxy inverso) para el Sistema Barbazul
#  Reemplaza "tudominio.com" por tu dominio real.
#
#  Ubicacion tipica en Ubuntu:
#    /etc/nginx/sites-available/barbazul
#  Activar:
#    sudo ln -s /etc/nginx/sites-available/barbazul /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  HTTPS: despues de que el dominio apunte a tu servidor, ejecuta:
#    sudo certbot --nginx -d tudominio.com -d www.tudominio.com
# ============================================================

server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /var/www/barbazul/app/static/;
    }
}
