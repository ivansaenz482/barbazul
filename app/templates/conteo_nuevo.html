{% extends "base.html" %}
{% block title %}Nuevo Conteo{% endblock %}
{% block content %}

<h2 class="mb-1"><i class="bi bi-clipboard-check me-2 text-primary"></i>Nuevo Conteo de Inventario</h2>
<p class="text-muted">Crea una sesión de conteo físico. El sistema toma una <strong>foto del stock actual</strong> de la ubicación elegida para comparar con lo que cuentes.</p>

<form method="POST" class="bg-white p-4 rounded shadow-sm" style="max-width: 640px;">
    <div class="mb-3">
        <label class="form-label">Nombre del conteo</label>
        <input type="text" name="nombre" class="form-control" placeholder="Ej. Conteo bodega local — fin de mes">
    </div>
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Ubicación a contar *</label>
            <select name="ubicacion" class="form-select" required>
                {% for clave, etq in ubicaciones %}
                <option value="{{ clave }}">{{ etq }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" class="form-control" value="{{ today }}">
        </div>
    </div>
    <div class="mb-3 mt-3">
        <label class="form-label">Notas</label>
        <input type="text" name="notas" class="form-control" placeholder="Opcional">
    </div>
    <button class="btn btn-primary">Iniciar conteo</button>
    <a href="{{ url_for('conteos.conteos_list') }}" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
