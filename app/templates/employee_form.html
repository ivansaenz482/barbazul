{% extends "base.html" %}
{% block title %}{{ "Editar" if employee else "Nuevo" }} Personal{% endblock %}
{% block content %}

<h2 class="mb-3"><i class="bi bi-people-fill me-2 text-primary"></i>{{ "Editar" if employee else "Nuevo" }} Personal</h2>

<form method="POST" class="bg-white p-4 rounded shadow-sm" style="max-width: 700px;">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Nombre completo *</label>
            <input type="text" name="name" class="form-control" value="{{ employee.name if employee else '' }}" required autofocus>
        </div>
        <div class="col-md-6">
            <label class="form-label">Rol / Cargo *</label>
            <select name="role" class="form-select">
                {% for key, label in roles %}
                <option value="{{ key }}" {% if employee and employee.role == key %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input type="text" name="phone" class="form-control" value="{{ employee.phone if employee else '' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Sueldo base ($)</label>
            <input type="number" step="0.01" min="0" name="base_salary" class="form-control" value="{{ employee.base_salary if employee else 0 }}">
            <div class="form-text">Referencia de cuánto se le paga. Los pagos se registran en <strong>Gastos</strong>.</div>
        </div>
        {% if employee %}
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="active" id="active" {% if employee.active %}checked{% endif %}>
                <label class="form-check-label" for="active">Activo</label>
            </div>
        </div>
        {% endif %}
    </div>

    <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('employees.employees_list') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>

{% endblock %}
